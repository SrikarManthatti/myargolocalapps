apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.applicationDetails.argowfs.name }}
  namespace: {{ .Values.applicationDetails.argowfs.namespace }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: '*'
    server: '*'
  project: initial-proj
  source:
    path: {{ .Values.applicationDetails.argowfs.path }}
    repoURL: 'https://github.com/SrikarManthatti/myargolocalapps.git'
    targetRevision: 'dev'